<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marketplace Move Bot · Arena Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f7f1; --panel:#ffffff; --panel2:#e9f0e7; --line:#cfdcca; --text:#11261a; --dim:#5b7462;
  --go:#0f7a1f; --go-ink:#ffffff; --warn:#9a5700; --warn-bg:#fff1d6; --off:#b9c7b5;
  --mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#050b07; --panel:#0a140d; --panel2:#0f1d13; --line:#1d3523; --text:#d5f3da; --dim:#6d8d74;
    --go:#39FF14; --go-ink:#031005; --warn:#ffb000; --warn-bg:#231800; --off:#24382a;
  }
}
:root[data-theme="dark"]{
  --bg:#050b07; --panel:#0a140d; --panel2:#0f1d13; --line:#1d3523; --text:#d5f3da; --dim:#6d8d74;
  --go:#39FF14; --go-ink:#031005; --warn:#ffb000; --warn-bg:#231800; --off:#24382a;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--mono);padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--go);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:22px 18px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{margin:0;font-size:20px;font-weight:800}
h1 span{color:var(--go)}
.dim{color:var(--dim)}
.small{font-size:12px}

/* request */
.ask{display:flex;gap:8px}
.ask textarea{flex:1;min-width:0;padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:15px;line-height:1.45;resize:none;overflow:hidden;min-height:50px;max-height:200px}
.ask{align-items:flex-start}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--go)}
.btn.primary{background:var(--go);color:var(--go-ink);border-color:var(--go);font-weight:700}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{background:var(--warn);color:#1a0f00;border-color:var(--warn);font-weight:700}
.taglist{margin:10px 0 0;padding:0;list-style:none}
.taglist li{display:flex;justify-content:space-between;border-bottom:1px dotted var(--line);padding:3px 0}
.btn.link{background:none;border:none;padding:4px 6px;color:var(--dim);text-decoration:underline;text-underline-offset:3px}
.tabs{display:flex;gap:4px;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--panel)}
.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:7px;cursor:pointer;color:var(--dim);font-weight:500;display:flex;gap:6px;align-items:center}
.tabs button[aria-selected="true"]{background:var(--go);color:var(--go-ink);font-weight:700}
.count-badge{font-size:11px;border-radius:999px;padding:0 6px;border:1px solid currentColor}
.source{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 12px;margin-bottom:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.source.real{border-color:var(--warn)}
.srcacts{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.how{flex-basis:100%;color:var(--dim)}
#srcMsg{flex-basis:100%}
#srcMsg:empty{display:none}
.drop body,.dropping{outline:3px dashed var(--go);outline-offset:-10px}
.slab .art{position:relative;overflow:hidden}
.slab .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#0b0f0c;padding:4px}
.more{margin-top:10px;text-align:center}
.mode{margin-left:6px;border:1px solid var(--warn);color:var(--warn);border-radius:5px;padding:0 6px;font-size:11.5px;font-weight:700}
.mode.live{border-color:var(--go);color:var(--go)}
.login{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:50;padding:20px}
.loginbox{width:min(380px,100%);border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:22px;display:flex;flex-direction:column;gap:12px}
.qtbl{width:100%;border-collapse:collapse;font-size:12.5px}
.qtbl th{position:sticky;top:0;background:var(--panel);z-index:1;text-align:left;font-size:11px;padding:7px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.qtbl td{padding:6px;border-bottom:1px solid var(--line);vertical-align:middle}
.qtbl tr.ready td{background:color-mix(in srgb,var(--go) 7%,transparent)}
.qtbl tr.sent td{opacity:.6}
.qtbl input[type=text],.qtbl input:not([type]){width:100%;min-width:60px;padding:6px 7px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);font:inherit}
.qtbl input.money{width:84px;min-width:84px}
.qtbl input.need{border-color:var(--warn)}
.qtbl .th{width:40px;height:52px;object-fit:cover;border-radius:4px;border:1px solid var(--line);cursor:zoom-in;display:block}
.qtbl .nm{font-weight:700}.qtbl .sub{color:var(--dim);font-size:11.5px}
.qhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:6px 0 10px}
.fillbar{display:flex;flex-wrap:wrap;gap:8px;align-items:end;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:10px}
.fillbar label{display:flex;flex-direction:column;gap:3px;font-size:11px;font-weight:700}
.fillbar input{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);font:inherit}
.qwrap{max-height:calc(100vh - 290px);overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.badge-n{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--go);color:var(--go-ink);font-size:11px;font-weight:700;text-align:center}
.okc{color:var(--go);font-weight:700}.errc{color:var(--warn)}
.users table{width:100%;border-collapse:collapse;font-size:12.5px}.users th,.users td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.users select,.users input,.acct input,.adduser input,.adduser select{padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--text);font:inherit}
.adduser,.acct{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin:12px 0;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.adduser label,.acct label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;font-weight:700}
.copyline{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px;padding:8px 10px;border:1px dashed var(--go);border-radius:8px;font-size:12px;word-break:break-all}
.rolebadge{border:1px solid var(--line);border-radius:5px;padding:0 6px;font-size:11px;font-weight:700;text-transform:uppercase}
.link-own{color:var(--go)}.link-shared,.link-missing{color:var(--warn)}
.loginbox h2{margin:0 0 4px;font-size:20px}.loginbox h2 span{color:var(--go)}
.loginbox label{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--dim)}
.loginbox input{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--go);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.btn.mic{display:inline-flex;align-items:center;gap:4px}
.btn.mic[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:#1a0f00;font-weight:700}
.btn.mic[aria-pressed="true"]::after{content:"";width:8px;height:8px;border-radius:50%;background:#c00;margin-left:4px;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.voicenote{min-height:0;font-size:12px;color:var(--dim);margin-top:4px}
.voicenote:empty{display:none}
@media (prefers-reduced-motion: reduce){.btn.mic[aria-pressed="true"]::after{animation:none}}
.savednote{min-height:18px;margin-top:6px;color:var(--go)}
.foot{margin-top:28px}
.saved{display:flex;flex-direction:column;gap:10px}
.sp{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center}
@media (max-width:720px){.sp{grid-template-columns:1fr}}
.sp .nm{font-weight:700}
.sp .nm input{font-weight:700;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:4px 8px;width:100%}
.sp .tx{color:var(--dim);font-size:12.5px;margin-top:2px}
.sp .acts{display:flex;gap:6px;flex-wrap:wrap}
.examples{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ex{border:1px dashed var(--line);background:transparent;border-radius:6px;padding:4px 8px;font-size:12px;cursor:pointer;color:var(--dim);text-align:left}
.ex:hover{color:var(--text);border-color:var(--go)}

/* summary */
.summary{margin-top:18px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);display:grid;grid-template-columns:1fr auto;gap:12px 18px;align-items:center}
@media (max-width:720px){.summary{grid-template-columns:1fr}}
@media (max-width:560px){.ask{flex-wrap:wrap}.ask textarea{flex-basis:100%}.ask .btn{flex:1}.btn.mic{flex:0 0 auto}}
.tagline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:7px 11px;cursor:pointer;color:var(--dim)}
.seg button[aria-pressed="true"]{background:var(--go);color:var(--go-ink);font-weight:700}
.tagfield{display:flex;align-items:center;border:1.5px solid var(--go);border-radius:8px;padding:0 10px;background:var(--bg)}
.tagfield input{border:0;background:transparent;padding:8px 0;font-weight:700;font-size:16px;width:min(260px,52vw);outline:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:2px 9px;font-size:12px}
.chip i{font-style:normal;color:var(--dim)}
.totals{text-align:right}
@media (max-width:720px){.totals{text-align:left}}
.totals .n{font-size:26px;font-weight:800;line-height:1}
.selbar{display:flex;gap:6px;justify-content:flex-end;margin-top:6px}
@media (max-width:720px){.selbar{justify-content:flex-start}}
.warn{grid-column:1/-1;background:var(--warn-bg);border:1px solid var(--warn);border-radius:8px;padding:8px 10px;font-size:12.5px}
.warn b{color:var(--warn)}

/* grid of cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(186px,1fr));gap:12px;margin-top:14px}
.tile{position:relative;border:1.5px solid var(--line);border-radius:12px;background:var(--panel);padding:10px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,opacity .15s}
.tile[aria-pressed="true"]{border-color:var(--go)}
.tile[aria-pressed="false"]{opacity:.45}
.tw{position:relative;display:flex;flex-direction:column}
a.btn{color:var(--text);text-decoration:none;display:inline-flex;align-items:center}
.tw .slab .lbl{padding-left:36px;padding-right:36px}
.tw .tile{flex:1}
.infob{position:absolute;top:8px;left:8px;z-index:2;width:24px;height:24px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--dim);font-size:13px;font-weight:700;cursor:pointer;display:grid;place-items:center}
.infob:hover{color:var(--text);border-color:var(--go)}
.facts{font-size:11px;color:var(--dim);line-height:1.45}
.facts b{color:var(--text);font-weight:500}
dialog.info{max-width:760px;width:calc(100% - 32px);padding:0}
.info .in{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:18px;padding:18px}
@media (max-width:640px){.info .in{grid-template-columns:1fr}}
.info .pic{background:#0b0f0c;border:1px solid var(--line);border-radius:10px;min-height:260px;display:grid;place-items:center;overflow:hidden}
.info .pic img{width:100%;height:100%;max-height:460px;object-fit:contain}
.info h2{margin:0 0 2px;font-size:18px}
.info dl{display:grid;grid-template-columns:max-content 1fr;gap:5px 14px;margin:12px 0;font-size:12.5px}
.info dt{color:var(--dim)}.info dd{margin:0;word-break:break-word}
.info .acts{display:flex;gap:8px;justify-content:flex-end;padding:0 18px 16px;flex-wrap:wrap}
.tile .check{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:800;background:var(--panel)}
.tile[aria-pressed="true"] .check{background:var(--go);border-color:var(--go);color:var(--go-ink)}
.slab{border:2px solid var(--off);border-radius:8px;overflow:hidden;background:var(--panel2)}
.slab .lbl{display:flex;justify-content:space-between;font-size:10.5px;font-weight:700;padding:4px 7px;background:var(--bg);border-bottom:1px solid var(--off)}
.slab .art{height:210px;display:grid;place-items:center;font-size:26px;font-weight:800;letter-spacing:-.02em;color:#ffffffd9}
.name{font-weight:700;font-size:13px;line-height:1.3}
.meta{font-size:11.5px;color:var(--dim);line-height:1.35}
.row{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px}
.ev{font-weight:700}
.tagchange{font-size:11.5px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.pill{border:1px solid var(--line);border-radius:5px;padding:0 5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill.new{border-color:var(--go);color:var(--go)}
.pill.old{border-color:var(--warn);color:var(--warn);text-decoration:line-through}
.done-badge{font-size:11.5px;color:var(--go);font-weight:700}
.pill.none{border-style:dashed;color:var(--dim)}
.pill.big{border-color:var(--warn);color:var(--warn);font-weight:700}
.up{color:var(--go)}.down{color:var(--warn)}
.evfield b{font-size:16px;margin-right:2px}
.seg.scope{display:inline-flex;vertical-align:middle;margin:0 6px}.seg.scope button{padding:3px 10px;font-size:12px}
.tileedit{display:flex;gap:6px;align-items:center;margin-top:6px;font-size:11px}.tileedit label{display:flex;align-items:center;gap:3px;flex:1}.tileedit input{width:100%;min-width:0;padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);font:inherit;font-size:12px}.tileedit input.need{border-color:var(--warn)}
.pend{font-size:11px;color:var(--warn);font-weight:700}
.copyb{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:20px;margin-left:5px;padding:0 4px;border:1px solid var(--line);border-radius:5px;font-size:12px;line-height:1;cursor:copy;color:var(--dim);vertical-align:middle;user-select:none}
.copyb:hover,.copyb:focus-visible{border-color:var(--go);color:var(--go);outline:none}
.copyb.done{border-color:var(--go);color:var(--go);font-weight:800}
.taglist.kinds{max-height:260px;overflow:auto}
.bands{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.band{font:inherit;font-size:12px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--text);cursor:pointer}
.band .cnt{color:var(--dim);margin-left:4px}
.band[aria-pressed="true"],.band.on{border-color:var(--go);background:var(--go);color:var(--go-ink)}
.band[aria-pressed="true"] .cnt{color:inherit;opacity:.8}
.pager{display:flex;gap:12px;align-items:center;justify-content:center;margin:12px 0}
.taglist.kinds li{padding:0;border:0}
.kindpick{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;gap:12px;width:100%;padding:7px 8px;border-bottom:1px dashed var(--line);cursor:pointer;border-radius:6px}
.kindpick:hover,.kindpick:focus-visible{background:color-mix(in srgb,var(--go) 12%,transparent);color:var(--go);outline:none}
.kindpick.did{opacity:.75}
.dupb{display:inline-block;margin-left:6px;padding:0 6px;border:1px solid var(--warn);border-radius:5px;color:var(--warn);font-size:11px;font-weight:700}
.gradeb{display:inline-block;margin-left:6px;padding:0 6px;border:1px solid #7cc4ff;border-radius:5px;color:#7cc4ff;font-size:11px;font-weight:700}
.dupsum{font-size:12px;color:var(--text)}
#liveMarks{transition:color .3s}#liveMarks.on{color:var(--go)}
.infonav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
/* popup edit box, in pairs: New EV | Last comp · Cert # | Grader · CL Value | Last sale · Use CL | Confirm */
.infoedit{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;align-items:end;margin:10px 0 12px;padding:10px;border:1px solid var(--go);border-radius:10px;background:color-mix(in srgb,var(--go) 7%,transparent)}
.infoedit > .small{grid-column:1 / -1}
.infoedit input,.infoedit select,.infoedit .clbox,.infoedit #ieCert{width:100%!important;box-sizing:border-box}
.infoedit > button{width:100%;justify-content:center}
.infoedit label{display:flex;flex-direction:column;gap:3px;font-size:11px;font-weight:700}
.infoedit select{height:36px;padding:0 8px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--text);font:inherit;font-weight:700}
.infoedit .clbox{height:36px;min-width:110px;font-size:14px}
.infoedit #ieCert{width:130px}
.infoedit input{width:120px;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--text);font:inherit;font-size:15px;font-weight:700}
.infoedit input.need{border-color:var(--warn)}
.sortpick{margin-left:auto;display:flex;gap:6px;align-items:center}
.sortpick select{padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);font:inherit;font-size:12px}
.owner-cust{color:#7cc4ff}
.arenanote{font-size:11px;color:#7cc4ff}
.tileedit{flex-wrap:wrap}
.arenaev{white-space:nowrap;font-size:12px;color:#7cc4ff;flex-basis:100%;order:3;text-align:right}
.arenaev b{font-size:14px;color:var(--go)}
.arenapanel{margin-top:8px;padding:7px 10px;border:1px solid #7cc4ff;border-radius:8px;font-size:12.5px;color:#cfe8ff;background:rgba(124,196,255,.07)}
.artbl{width:100%;border-collapse:collapse;font-size:13px}.artbl th,.artbl td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line)}
.setno{color:var(--text);font-weight:700}
.age-new{color:var(--go)}
/* Arena Club slab */
.aslab{border-radius:10px;padding:6px;background:linear-gradient(160deg,#e9ece9,#c9cfcb 45%,#f4f6f4);border:1px solid #b9c0bb;display:flex;flex-direction:column;gap:6px;aspect-ratio:3/4.1;box-sizing:border-box}
.tw .aslab{padding-top:30px}
.alabel{background:#121212;color:#fff;border-radius:4px;padding:5px 7px;display:flex;flex-direction:column;gap:3px}
.al-top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.al-player{font-size:9.5px;font-weight:800;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.al-logo{font-size:9px;font-weight:900;letter-spacing:.08em;line-height:1;text-align:right;flex:none}
.al-logo span{display:block;font-size:5.5px;letter-spacing:.3em;font-weight:700;color:#bdbdbd}
.al-body{display:flex;gap:8px;align-items:center}
.al-gr{flex:none;text-align:center}
.al-g{font-size:24px;font-weight:900;line-height:1}
.al-w{font-size:6.5px;font-weight:700;letter-spacing:.06em;color:#cfcfcf;white-space:nowrap}
.al-m{font-size:8px;line-height:1.3;color:#e6e6e6;min-width:0}
.al-m div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.al-ac{font-size:6.5px;color:#bdbdbd;letter-spacing:.06em;text-align:right}
.acard{flex:1;border-radius:4px;background:linear-gradient(150deg,#3b3b3b,#151515);display:grid;place-items:center;color:rgba(255,255,255,.55);font-weight:900;font-size:30px;border:1px solid #9aa19c}
.aslab.big{max-width:320px;margin:0 auto}
.aslab.big .al-player{font-size:13px}.aslab.big .al-g{font-size:36px}.aslab.big .al-w{font-size:9px}
.aslab.big .al-m{font-size:11.5px}.aslab.big .al-logo{font-size:13px}.aslab.big .al-logo span{font-size:7.5px}.aslab.big .al-ac{font-size:9px}.aslab.big .acard{font-size:56px}
.didb{display:inline-block;margin-right:8px;padding:0 6px;border:1px solid var(--go);border-radius:5px;color:var(--go);font-size:11px;font-weight:700}
.kindpick.on{background:color-mix(in srgb,var(--go) 18%,transparent);color:var(--go);font-weight:700}
.versions .focusbar{margin-top:0}
.focusbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:10px;padding:8px 12px;border:1px solid var(--go);border-radius:10px;background:color-mix(in srgb,var(--go) 8%,transparent)}
.copyv{font-weight:700;color:var(--text);cursor:copy;border-bottom:1px dashed var(--line);user-select:text}
.copyv:hover{color:var(--go);border-bottom-color:var(--go)}
.copyv.flash{color:var(--go);border-bottom-color:var(--go)}
.tile .facts b,.tile .row .dim{user-select:text}
.evfield input{width:min(140px,40vw)}
.evform{display:grid;grid-template-columns:1.6fr .7fr 1.2fr;gap:8px;margin-top:10px}
.evform.evrow{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.15fr) minmax(0,.85fr) minmax(0,1fr) minmax(0,1fr);align-items:start;margin-top:0}
.evform.evrow > label{justify-content:flex-start}
.evform.evrow .lt{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:16px;line-height:16px}
.evform.evrow #clCert,.evform.evrow #clGrader{height:42px;box-sizing:border-box;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit;font-size:14px;font-weight:700;width:100%}
.clbox{display:flex;align-items:center;height:42px;box-sizing:border-box;padding:0 10px;border:1px dashed var(--line);border-radius:10px;font-size:15px;font-weight:800;gap:6px;overflow:hidden;white-space:nowrap}
.clbox.ok{border-style:solid;border-color:var(--go);color:var(--go)}
.clbox .note{font-size:11px;font-weight:400;color:var(--dim);white-space:normal;line-height:1.2}
.salebox{display:flex;flex-direction:column;line-height:1.15;font-size:13px}
.salebox .note{font-size:11px}
.sale-old{color:#e5484d;font-weight:800}
/* Card Ladder Off: the earlier, simpler layout */
body.cl-off .clonly{display:none!important}
body.cl-off .evform.evrow,body.cl-off .evform.evurl,body.cl-off .evform.evnote{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
body.cl-off .evform.evurl > label,body.cl-off .evform.evnote > label{grid-column:1 / -1}
.titlerow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
h1.brand{display:flex;align-items:center;gap:10px;letter-spacing:.02em}
h1.brand .robot{height:112px;width:auto;flex:none;margin:0}
h1.brand{margin:0}
h1.brand .bt span{color:var(--go)}
.logo-arena{height:38px;width:auto;display:block;margin-right:2px}
.logo-cl{height:30px;width:auto;display:block;margin-right:6px}
.armode .pct{font-size:18px;font-weight:900;margin-right:6px}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]) .logo-arena, :root:not([data-theme="dark"]) .logo-cl{background:#111;border-radius:5px;padding:2px 4px} }
:root[data-theme="light"] .logo-arena,:root[data-theme="light"] .logo-cl{background:#111;border-radius:5px;padding:2px 4px}
.amark{display:inline-flex;flex-direction:column;align-items:center;line-height:1;font-weight:900;font-size:10px;letter-spacing:.08em;color:var(--text);margin-right:5px}
.amark span{font-size:6px;letter-spacing:.32em;font-weight:700;color:var(--dim)}
.clmode{display:inline-flex;align-items:center;gap:4px;vertical-align:middle}
.clmode button{padding:2px 9px;font-size:11.5px}
.sale-old .note{color:#e5484d}
.sale-new{color:var(--go)}
.clUse{margin-top:6px;padding:5px 6px;font-size:12px;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flashbox{animation:flashb 1s}
@keyframes flashb{0%{box-shadow:0 0 0 3px var(--go)}100%{box-shadow:0 0 0 0 transparent}}
#toast{position:fixed;right:16px;bottom:96px;z-index:50;max-width:380px;padding:10px 14px;border:1px solid var(--go);border-radius:10px;background:var(--panel);font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
/* URL + note rows line up with Estimated value + Last comp (they end where Last comp ends) */
.evform.evurl,.evform.evnote{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.15fr) minmax(0,.85fr) minmax(0,1fr) minmax(0,1fr)}
.evform.evurl > label,.evform.evnote > label{grid-column:1 / 3}
.evform.evurl input{height:42px;box-sizing:border-box;font-size:13px}

.evform .tagfield{padding:0 10px}.evform .tagfield input{border:0;padding:8px 0;width:100%;min-width:0}
.evform.evrow label{justify-content:flex-end}
.evform.evrow .tagfield{height:42px;box-sizing:border-box;width:100%;min-width:0}
.evform.evrow{gap:8px}
.evform.evrow > label{min-width:0}
.evform.evrow .clbox{min-width:0;padding:0 8px}
/* bigger value row: taller boxes, larger numbers */
.evform.evrow{gap:10px}
.evform.evrow .lt{font-size:12.5px;height:18px;line-height:18px}
.evform.evrow .tagfield,.evform.evrow #clCert,.evform.evrow #clGrader,.evform.evrow .clbox{height:54px!important;border-radius:12px}
.evform.evrow .tagfield b{font-size:20px}
.evform.evrow .tagfield input{font-size:20px!important;font-weight:800}
.evform.evrow #clCert{font-size:17px!important}
.evform.evrow #clGrader{font-size:16px!important}
.evform.evrow .clbox{font-size:20px}
.evform.evrow .salebox{font-size:15px}
.evform.evrow .salebox .note{font-size:12px}
.clUse{margin-top:8px;padding:8px 6px;font-size:13px}
.evform.evrow .tagfield input{height:100%;padding:0;font-size:15px;font-weight:700}

.evform .lcfield{border-color:var(--line)}
.evform label{display:flex;flex-direction:column;gap:3px;font-size:11.5px;font-weight:700}
.evform input{padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:inherit;font:inherit;font-weight:400}
.evform input.need{border-color:var(--warn)}
.evform .req{color:var(--warn)}
@media (max-width:820px){.evform.evrow,.evform.evurl,.evform.evnote{grid-template-columns:1fr 1fr 1fr}}
@media (max-width:720px){.evform,.evform.evrow,.evform.evurl,.evform.evnote{grid-template-columns:1fr}.evform.evurl > label,.evform.evnote > label{grid-column:auto}}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.quick .btn{padding:3px 8px;font-size:12px}
.nowline{display:flex;gap:5px;align-items:center;flex-wrap:wrap;width:100%}
.summary.result{border-color:var(--go)}
.rh{font-size:17px;font-weight:800;color:var(--go)}
.tile.changed{border-color:var(--go)}

.empty{margin-top:28px;padding:28px;border:1px dashed var(--line);border-radius:12px;text-align:center;color:var(--dim)}

/* sticky confirm bar */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px))}
.bar .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bar .msg{flex:1;min-width:200px}
.bar .big{padding:12px 20px;font-size:15px}
.tog{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);cursor:pointer}
.progress{height:5px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-top:6px}
.progress span{display:block;height:100%;width:0;background:var(--go);transition:width .12s}

/* activity */
details.activity{margin-top:22px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
details.activity summary{cursor:pointer;padding:10px 14px;color:var(--dim);font-size:12.5px}
.log{max-height:280px;overflow:auto;padding:4px 14px 12px;font-size:11.5px}
.log div{padding:2px 0;border-bottom:1px dotted var(--line);word-break:break-word}
.log .w{color:var(--warn)}
.history{margin-top:12px}
.history table{border-collapse:collapse;width:100%;font-size:12px}
.history td,.history th{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.history th{color:var(--dim);font-weight:500}
.tblwrap{overflow-x:auto}

dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);padding:20px;max-width:420px;width:calc(100% - 32px)}
dialog::backdrop{background:#000a}
dialog.info::backdrop{background:#000c}
dialog h2{margin:0 0 8px;font-size:17px}
dialog .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=n=>"$"+Math.round(n).toLocaleString();
const money2=n=>n==null?"—":"$"+Number(n).toLocaleString(undefined,{minimumFractionDigits:Number(n)%1?2:0,maximumFractionDigits:2});
const when=t=>t?new Date(t).toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}):"";
const dayOf=iso=>{const d=new Date(iso); return isNaN(d)?"":`${d.getMonth()+1}/${d.getDate()}/${d.getFullYear()}`;};
const cardKey=r=>[r.set_name,r.player_name,r.set_number?"#"+r.set_number:"",r.parallel_name||"base",(r.grade||"").toUpperCase()].filter(Boolean).join(" · ");
const chunks=(arr,n)=>{const out=[];for(let i=0;i<arr.length;i+=n)out.push(arr.slice(i,i+n));return out};
const HUE={};
async function api(path,body){
  const r=await fetch("/api/ui/"+path,body===undefined?{credentials:"same-origin"}:{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  let d={}; try{d=await r.json()}catch{}
  if(r.status===401&&d.error==="signed_out"){showLogin();throw new Error("Please sign in.")}
  if(!r.ok) throw new Error(d.error||`Request failed (${r.status})`);
  return d;
}
let toastT;
function toast(html){ let t=$("#toast"); if(!t){ t=document.createElement("div"); t.id="toast"; t.setAttribute("role","status"); document.body.appendChild(t); } t.innerHTML=html; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,3500); }
function ask({title,body,yes,danger=false,word=null}){
  return new Promise(res=>{
    const d=$("#dlg"), y=$("#dlgYes"), n=$("#dlgNo"), tw=$("#dlgTypeWrap"), ti=$("#dlgType");
    $("#dlgTitle").textContent=title; $("#dlgBody").innerHTML=body;
    y.textContent=yes; y.className="btn "+(danger?"danger":"primary");
    tw.hidden=!word; ti.value=""; if(word)$("#dlgWord").textContent=word;
    y.disabled=!!word;
    ti.oninput=()=>{y.disabled=ti.value.trim().toLowerCase()!==String(word).toLowerCase()};
    const done=v=>{d.close();y.onclick=n.onclick=d.oncancel=null;res(v)};
    y.onclick=()=>done(true); n.onclick=()=>done(false); d.oncancel=()=>done(false);
    d.showModal(); if(word) ti.focus();
  });
}

/* copy buttons (cert, AC, order): copy without selecting/deselecting the tile */
const copyBtn=(v,what)=>v?`<span class="copyb" role="button" tabindex="0" data-copy="${esc(v)}" title="Copy ${esc(what)}" aria-label="Copy ${esc(what)} ${esc(v)}">⧉</span>`:"";
const copyVal=(v,what)=>v?`<span class="copyv" data-copy="${esc(v)}" title="Click to copy ${esc(what)}">${esc(v)}</span>`:"";
async function copyText(el){
  const v=el.dataset.copy; let ok=false;
  if(el.classList.contains("copyv")){ const icon=el.nextElementSibling&&el.nextElementSibling.classList.contains("copyb")?el.nextElementSibling:null;
    el.classList.add("flash"); setTimeout(()=>el.classList.remove("flash"),900); if(icon) el=icon; }
  try{ await navigator.clipboard.writeText(v); ok=true; }catch{ const t=document.createElement("textarea"); t.value=v; document.body.appendChild(t); t.select(); try{ok=document.execCommand("copy")}catch{} t.remove(); }
  el.textContent=ok?"✓":"!"; el.classList.add("done"); setTimeout(()=>{el.textContent="⧉"; el.classList.remove("done")},1200);
}
const copyTarget=e=>(e.target.closest&&e.target.closest("[data-copy]"))||null;
document.addEventListener("click",e=>{const c=copyTarget(e); if(!c) return; e.preventDefault(); e.stopPropagation(); copyText(c);},true);
document.addEventListener("mousedown",e=>{ if(copyTarget(e)) e.preventDefault(); },true);
document.addEventListener("keydown",e=>{const c=e.target.closest&&e.target.closest(".copyb"); if(!c||(e.key!=="Enter"&&e.key!==" ")) return; e.preventDefault(); e.stopPropagation(); copyText(c);},true);

/* Arena Club slab drawn from the card's data when there's no slab photo */
const isArena=r=>/arena/i.test(String(r.grading_company||String(r.grade||"").split(" ")[0]||""));
const GRADE_WORD={"10":"GEM MINT","9.5":"MINT+","9":"MINT","8.5":"NM-MT+","8":"NM-MT","7.5":"NM+","7":"NM","6.5":"EX-MT+","6":"EX-MT","5":"EX","4":"VG-EX","3":"VG","2":"GOOD","1.5":"FAIR","1":"POOR"};
const acLabel=ac=>ac?"8AC"+String(ac).replace(/\D/g,"").padStart(9,"0"):"";
function arenaSlab(r){
  const g=String(r.grade||"").trim().split(/\s+/).pop()||"";
  const num=r.set_number?"#"+String(r.set_number).replace(/^#/,""):"";
  const lines=[r.set_name,r.insert,num,r.parallel_name].filter(Boolean);
  return `<div class="aslab" title="Arena Club slab">
    <div class="alabel">
      <div class="al-top"><span class="al-player">${esc(String(r.player_name||"").toUpperCase())}</span><span class="al-logo">ARENA<span>CLUB</span></span></div>
      <div class="al-body"><div class="al-gr"><div class="al-g">${esc(g)}</div><div class="al-w">${esc(GRADE_WORD[g]||"")}</div></div>
        <div class="al-m">${lines.map(l=>`<div>${esc(l)}</div>`).join("")}</div></div>
      <div class="al-ac">${esc(acLabel(r.ac))}</div>
    </div>
    <div class="acard"><span>${esc(String(r.player_name||"").split(/[\s.]+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase())}</span></div>
  </div>`;
}

/* ---------- state ---------- */
let S=null; // {matched, rows, total, filters, selected:Set, phase:'review'|'working'|'done', page, lastText, result}
let findSeq=0;
const PAGE=200;
const EMPTY_HELP=`Search the cards to move, e.g. <b>tag sd_wemby_grail</b> — or a player / set, an <b>order 1234567</b>, <b>po 4386</b>, or AC / cert numbers. Select them, then <b>Move to Marketplace</b>.`;

/* EV range tabs: filter what's on screen; the picked tab also goes with the next search */
const BANDS=[{id:"all",label:"All"},{id:"u500",label:"<$499",max:499.99},{id:"500",label:"$500–$999",min:500,max:999.99},{id:"1k",label:"$1,000–$2,499",min:1000,max:2499.99},{id:"2500",label:"$2,500–$4,999",min:2500,max:4999.99},{id:"5k",label:"$5,000+",min:5000}];
let BAND="all";
const inBand=(r,b)=>{const B=BANDS.find(x=>x.id===b)||BANDS[0]; const v=r.ev||0; return (B.min==null||v>=B.min)&&(B.max==null||v<=B.max);};
let SORT="ev_hi";
const SORTS=[["ev_hi","Value · high to low"],["ev_lo","Value · low to high"],["ac","AC # · newest first"],["player","Player · A–Z"]];
function sortRows(rows){
  const by={ev_hi:(x,y)=>(y.ev||0)-(x.ev||0), ev_lo:(x,y)=>(x.ev||0)-(y.ev||0), ac:(x,y)=>String(y.ac).localeCompare(String(x.ac),undefined,{numeric:true}), player:(x,y)=>String(x.player_name).localeCompare(String(y.player_name))}[SORT];
  return by?[...rows].sort(by):rows;
}

/* ---------- find ---------- */
async function find(text){
  if(!text.trim()) return;
  const seq=++findSeq;
  $("#empty").hidden=false; $("#empty").innerHTML=`<span class="spin"></span>Searching Metabase 4131…`; $("#summary").innerHTML=""; $("#grid").innerHTML=""; $("#bar").hidden=true;
  const B=BANDS.find(x=>x.id===BAND)||BANDS[0];
  let res;
  try{ res=await api("find",{text,min_ev:B.min??null,max_ev:B.max??null}); }
  catch(e){ if(seq===findSeq) showEmpty(e.message); return; }
  if(seq!==findSeq) return;
  const at=new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit",second:"2-digit"});
  $("#srcCount").textContent=`· ${res.total.toLocaleString()} matching · pulled ${at} (${(res.ms/1000).toFixed(1)}s)`;
  const byOrder=!!(res.parsed&&res.parsed.filters&&res.parsed.filters.scope);
  $("#srcLabel").textContent=byOrder?"Every card in the order (customers too) · orders question, fresh every search":"All warehouse cards · Metabase 4131, fresh every search";
  if(!res.has_filter){ showEmpty("Add at least one filter: a tag, player, set, parallel, grade, value range, order, AC number or cert number."); return; }
  S={matched:res.cards, total:res.total, filters:res.parsed.filters||{}, post:res.parsed.post_filters||{}, missing:res.missing||[], phase:"review", page:0, lastText:text};
  recompute(true);
}
function recompute(resetSelection){
  S.rows=sortRows(BAND==="all"?S.matched:S.matched.filter(r=>inBand(r,BAND)));
  // cards moved through this bot in the last 7 days start unselected (no double moves)
  if(resetSelection||!S.selected) S.selected=new Set(S.rows.filter(r=>!r.moved).map(r=>r.item_id));
  else S.selected=new Set([...S.selected].filter(id=>S.rows.some(r=>r.item_id===id)));
  render();
}
function showEmpty(msg){S=null;$("#summary").innerHTML="";$("#grid").innerHTML="";$("#empty").hidden=false;$("#empty").textContent=msg;$("#bar").hidden=true;renderBands()}

/* ---------- render ---------- */
const LAB={order_number:"order",po_number:"PO",insert:"insert",pasted:"pasted",set_number:"card #",contains:"also matches",ac_number:"AC #",cert_number:"cert",player_name:"player",set_name:"set",parallel_name:"parallel",grading_company:"grader",grade:"grade",min_estimated_value:"EV from",max_estimated_value:"EV up to",sport:"sport",tag:"tag",year:"year",scope:"scope"};
function render(){
  if(!S) return;
  $("#empty").hidden=!!S.rows.length;
  if(!S.rows.length) $("#empty").textContent=`No cards matched${S.missing.length?" "+S.missing.join(", "):""}${BAND!=="all"?" in this EV range":""}. Check the spelling, or try fewer filters.`;
  const sel=S.rows.filter(r=>S.selected.has(r.item_id));
  const evSel=sel.reduce((a,r)=>a+(r.ev||0),0);
  const movedN=S.rows.filter(r=>r.moved).length;
  const chips=Object.entries(S.filters).map(([k,v])=>`<span class="chip"><i>${Array.isArray(v)?`${LAB[k]||k}s (${v.length})`:(LAB[k]||k)}</i> ${esc(k.includes("value")?money(v):v==="__base__"?"base (no parallel)":Array.isArray(v)?v.join(" or "):String(v).replace("%"," "))}</span>`).join("")+(S.post&&S.post.only_base?`<span class="chip"><i>parallel</i> base only</span>`:"");
  const locked=S.phase!=="review";
  $("#summary").innerHTML=S.phase==="done"?resultHeader():`<div class="summary">
    <div>
      <div class="chips">${chips}</div>
      ${movedN?`<div class="warn"><b>${movedN} ${movedN===1?"card was":"cards were"} already moved</b> through this bot in the last 7 days — left unselected. Click a tile to include it anyway.</div>`:""}
      ${S.missing.length?`<div class="warn"><b>Nothing found for ${esc(S.missing.join(", "))}.</b></div>`:""}
    </div>
    <div class="totals">
      <div class="n">${sel.length}<span class="dim small" style="font-size:13px;font-weight:500"> of ${S.rows.length} selected</span></div>
      <div class="dim small">${money(evSel)} total EV selected</div>
      ${S.total>S.matched.length?`<div class="small" style="color:var(--warn)">Loaded the first ${S.matched.length.toLocaleString()} of ${S.total.toLocaleString()} matches — pick an EV range or narrow the search.</div>`:""}
      ${locked?"":`<div class="selbar"><button class="btn link" type="button" id="all">Select all</button><button class="btn link" type="button" id="none">Clear</button></div>`}
    </div>
  </div>`;
  const showRows=S.phase==="done"&&!S.showAll?S.rows.filter(r=>S.result.has(r.item_id)):S.rows;
  const pages=Math.max(1,Math.ceil(showRows.length/PAGE)); S.page=Math.min(Math.max(S.page,0),pages-1);
  const pageRows=showRows.slice(S.page*PAGE,(S.page+1)*PAGE);
  const pager=pages>1?`<div class="pager"><button class="btn" type="button" data-pg="${S.page-1}" ${S.page===0?"disabled":""}>‹ Prev</button>
    <span class="small">Page <b>${S.page+1}</b> of ${pages} · cards ${(S.page*PAGE+1).toLocaleString()}–${Math.min((S.page+1)*PAGE,showRows.length).toLocaleString()} of ${showRows.length.toLocaleString()}</span>
    <button class="btn" type="button" data-pg="${S.page+1}" ${S.page>=pages-1?"disabled":""}>Next ›</button></div>`:"";
  $("#grid").innerHTML=showRows.length?`${pager}<div class="grid">${pageRows.map(tile).join("")}</div>${pager}`:"";
  document.querySelectorAll(".pager [data-pg]").forEach(b=>b.onclick=()=>{S.page=+b.dataset.pg; render(); $("#grid").scrollIntoView({behavior:"smooth",block:"start"});});
  const a=$("#all"), n=$("#none");
  if(a) a.onclick=()=>{S.selected=new Set(S.rows.map(r=>r.item_id));render()};
  if(n) n.onclick=()=>{S.selected=new Set();render()};
  const sa=$("#showAll"); if(sa) sa.onclick=()=>{S.showAll=!S.showAll;render()};
  const bt=$("#againTop"); if(bt) bt.onclick=()=>find(S.lastText);
  renderBands(); renderBar(sel.length);
}
function resultHeader(){
  const R=S.res, others=S.rows.length-S.result.size;
  const head=R.dry_run?`Dry run — ${R.moved} cards would be moved to the marketplace`:`✓ ${R.moved} ${R.moved===1?"card":"cards"} moved to the marketplace${R.failed?` · <span style="color:var(--warn)">${R.failed} failed</span>`:""}`;
  const sub=R.dry_run?`Nothing was written. Example call: <code>${esc(R.sample_call?R.sample_call.method+" "+R.sample_call.url:"")}</code>${R.sample_call&&R.sample_call.body!==undefined?` <code>${esc(JSON.stringify(R.sample_call.body))}</code>`:""}`:R.failed?"Failed cards show the error from admin on the tile. Fix and try them again.":"Run the search again to see their new status.";
  return `<div class="summary result">
    <div><div class="rh">${head}</div><div class="dim small">${sub}</div></div>
    <div class="totals"><button class="btn" type="button" id="againTop">↻ Search again</button>${others>0?`<button class="btn link" type="button" id="showAll">${S.showAll?"Show only moved cards":`Also show ${others} not included`}</button>`:""}</div>
  </div>`;
}
function tile(r){
  const on=S.selected.has(r.item_id);
  const name=r.player_name||"(no player)";
  const h=HUE[name]??[...name].reduce((a,c)=>(a*31+c.charCodeAt(0))%360,7);
  const pw=name.split(" ");
  const initials=pw.length>1?pw.map(w=>w[0]).join("").replace(".",""):name.slice(0,2).toUpperCase();
  let change="";
  if(S.phase==="done"){
    const x=S.result.get(r.item_id);
    change=!x?`<span class="dim">Not included</span>`:x.ok?`<span class="pill new">${S.res.dry_run?"would move":"✓ moved"}</span>`:`<span class="pill big" title="${esc(x.error||"")}">failed${x.status?` (HTTP ${x.status})`:""} — ${esc(String(x.error||"").slice(0,60))}</span>`;

  const facts=[
    r.cert?`Cert ${copyVal(r.cert,"cert")}${copyBtn(r.cert,"cert")}`:"",

  ].filter(Boolean).join("<br>");
  return `<div class="tw"><button type="button" class="tile" data-id="${r.item_id}" aria-pressed="${on}" ${S.phase!=="review"?"disabled":""} aria-label="${esc(name)} ${esc(r.set_name)}">
    <span class="check" aria-hidden="true">${on?"✓":""}</span>
    ${isArena(r)&&!r.img?arenaSlab(r):`<div class="slab"><div class="lbl"><span>${esc((r.grade||"").toUpperCase())}</span><span>${r.parallel_total?"/"+esc(r.parallel_total):""}</span></div>
      <div class="art" style="background:linear-gradient(150deg,hsl(${h} 55% 38%),hsl(${(h+40)%360} 60% 22%))">${esc(initials)}${r.img?`<img src="${esc(r.img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:""}</div></div>`}
    <div class="name">${esc(name)}</div>
    <div class="meta">${esc(r.set_name)}${r.insert?" · "+esc(r.insert):""}${r.set_number?` · <b class="setno">#${esc(String(r.set_number).replace(/^#/,""))}</b>`:""}${r.parallel_name?"<br>"+esc(r.parallel_name):""}</div>
    <div class="row"><span class="dim">AC ${copyVal(r.ac,"AC number")}${copyBtn(r.ac,"AC number")}</span><span class="ev">${money2(r.ev)}</span></div>
    ${facts?`<div class="facts">${facts}</div>`:""}
    ${r.moved&&S.phase==="review"?`<div class="pend">Moved ${dayOf(r.moved.at)} by ${esc(r.moved.by)}</div>`:""}
    <div class="tagchange">${change}</div>
  </button></div>`;
}
$("#grid").addEventListener("click",e=>{const t=e.target.closest(".tile");if(!t||!S||S.phase!=="review")return;const id=t.dataset.id;S.selected.has(id)?S.selected.delete(id):S.selected.add(id);render()});

function renderBar(n){

/* ---------- move ---------- */
$("#moveBtn").onclick=async()=>{
  if(!S||S.phase!=="review") return;
  const sel=S.rows.filter(r=>S.selected.has(r.item_id)); if(!sel.length) return;
  const dry=$("#dry").checked||(ME&&ME.dry_run);
  const kinds=new Map(); sel.forEach(r=>{const k=cardKey(r); kinds.set(k,(kinds.get(k)||0)+1)});
  const ok=await ask({title:`${dry?"Dry run: ":""}Move ${sel.length} ${sel.length===1?"card":"cards"} to the marketplace?`,
    body:`${money(sel.reduce((a,r)=>a+(r.ev||0),0))} total EV.<ul class="taglist">${[...kinds].sort((a,b)=>b[1]-a[1]).slice(0,10).map(([t,n])=>`<li><span>${esc(t)}</span><span>${n}</span></li>`).join("")}</ul>${kinds.size>10?`<div class="dim">+ ${kinds.size-10} more kinds</div>`:""}`,
    yes:dry?"Yes, dry run":"Yes, move", word:!dry&&sel.length>=25?String(sel.length):null});
  if(!ok) return;
  S.phase="working"; render();
  const prog=$("#prog"), bar=prog.querySelector("span"); prog.hidden=false; bar.style.width="0%";
  const parts=chunks(sel.map(r=>({item_id:r.item_id,ev:r.ev??null,label:cardKey(r)})),ME.max_items_per_run||250);
  const all=[]; let done=0;
  S.result=new Map();
  for(const items of parts){
    try{ const r=await api("move",{items,dry_run:dry}); all.push(r);
      for(const id of r.moved_ids) S.result.set(id,{ok:true});
      for(const f of r.failures) S.result.set(f.item_id,{ok:false,status:f.status,error:f.error}); }
    catch(e){ for(const it of items) S.result.set(it.item_id,{ok:false,status:0,error:e.message}); }
    done+=items.length; bar.style.width=Math.round(done/sel.length*100)+"%";
  }
  prog.hidden=true;
  S.res={dry_run:all.length?all[0].dry_run:dry, moved:[...S.result.values()].filter(x=>x.ok).length, failed:[...S.result.values()].filter(x=>!x.ok).length, sample_call:all[0]?all[0].sample_call:null};
  S.phase="done"; S.page=0; render(); renderHistory(); scrollTo({top:0,behavior:"smooth"});
};

async function renderHistory(){

    const runs=await api("runs");
    $("#history").innerHTML=runs.length?`<table><tr><th>run</th><th>moved</th><th>failed</th><th>by</th><th>when</th></tr>${runs.map(r=>`<tr><td>${esc(r.run_id)}${r.dry_run?` <span class="dim">(dry run)</span>`:""}</td><td>${r.moved}</td><td>${r.failed?`<span style="color:var(--warn)">${r.failed}</span>`:0}</td><td>${esc(r.by||"")}</td><td>${when(r.at)}</td></tr>`).join("")}</table>`:`<div class="dim small" style="padding:10px 14px">No moves yet.</div>`;

}

/* ---------- voice: talk into the request box (Chrome, Edge, Safari) ---------- */
(()=>{
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const btn=$("#micBtn"), note=$("#voiceNote"), box=$("#input");
  if(!SR){ btn.title="Voice input needs Chrome, Edge or Safari"; btn.disabled=true; return; }
  const NUM={zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10};
  // turn how people talk into how the box reads: "sd underscore wemby pack" -> "sd_wemby_pack", "p s a ten" -> "psa 10"
  const tidy=t=>t
    .replace(/\bhash ?tag\s+/gi,"#")
    .replace(/\s*\bunderscore\b\s*/gi,"_")
    .replace(/\bp\.? ?s\.? ?a\b/gi,"psa").replace(/\bb\.? ?g\.? ?s\b/gi,"bgs").replace(/\bs\.? ?g\.? ?c\b/gi,"sgc").replace(/\bc\.? ?g\.? ?c\b/gi,"cgc").replace(/\bc\.? ?s\.? ?g\b/gi,"csg")
    .replace(/\b(psa|bgs|beckett|sgc|cgc|csg|grade)\s+(zero|one|two|three|four|five|six|seven|eight|nine|ten)(\s+point\s+five)?\b/gi,(m,g,n,h)=>`${g} ${NUM[n.toLowerCase()]}${h?".5":""}`)
    .replace(/\b(\d+)\s+point\s+five\b/gi,"$1.5")
    .replace(/\b(\d[\d,]*)\s*dollars?\b/gi,"$$$1")
    .replace(/\s+([,.])/g,"$1").replace(/[.]\s*$/,"")
    .replace(/\s{2,}/g," ");
  let rec=null, listening=false, before="";
  const ui=on=>{ listening=on; btn.setAttribute("aria-pressed",on); btn.querySelector(".mictxt").textContent=on?" Stop":" Voice"; note.textContent=on?"Listening… speak, then click Stop (or just pause). You can edit the text before searching.":""; };
  const start=()=>{
    rec=new SR(); rec.lang="en-US"; rec.interimResults=true; rec.continuous=true;
    before=box.value.trim(); if(before) before+=" ";
    rec.onresult=e=>{
      let said=""; for(let i=0;i<e.results.length;i++) said+=e.results[i][0].transcript;
      box.value=before+tidy(said.trim());
      box.dispatchEvent(new Event("input",{bubbles:true}));
    };
    rec.onerror=e=>{
      ui(false);
      note.textContent=e.error==="not-allowed"||e.error==="service-not-allowed"
        ?"The microphone is blocked. Allow it for this site (the lock or camera icon in the address bar), then try again."
        :e.error==="no-speech"?"Didn't hear anything. Click Voice and try again.":`Voice stopped (${e.error}).`;
    };
    rec.onend=()=>{ if(listening){ ui(false); box.focus(); } };
    try{ rec.start(); ui(true); }catch{ ui(false); }
  };
  btn.onclick=()=>{ if(listening){ rec&&rec.stop(); ui(false); box.focus(); } else start(); };
})();



/* ---------- sign-in, first-time setup, invites ---------- */
let ME=null, LMODE="login";
const INVITE=new URLSearchParams(location.search).get("invite");
async function post(path,body){
  const r=await fetch("/api/ui/"+path,{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const d=await r.json().catch(()=>({})); if(!r.ok) throw new Error(d.error||"Something went wrong."); return d;
}
function loginMode(mode,intro){
  LMODE=mode;
  $("#lnameWrap").hidden=mode!=="setup"; $("#lcodeWrap").hidden=mode!=="setup";
  $("#lemailWrap").hidden=mode==="invite"; $("#lpass2Wrap").hidden=mode==="login";
  $("#lpass").autocomplete=mode==="login"?"current-password":"new-password";
  $("#lbtn").textContent=mode==="login"?"Sign in":mode==="setup"?"Create admin account":"Set password";
  $("#lfoot").hidden=mode!=="login";
  $("#lintro").innerHTML=intro||"";
}
async function showLogin(){
  $("#login").hidden=false;
  if(INVITE){
    try{ const i=await post("invite-info",{token:INVITE}); loginMode("invite",`Hi ${esc(i.name)} — choose a password for <b>${esc(i.email)}</b>.`); }
    catch(e){ loginMode("login",`<span style="color:var(--warn)">${esc(e.message)}</span>`); }
  }else{
    try{ const c=await (await fetch("/api/ui/config",{credentials:"same-origin"})).json();
      if(c.needs_setup) loginMode("setup","First time here: create the first admin account. You'll need the SETUP_CODE from Vercel.");
      else loginMode("login");
    }catch{ loginMode("login"); }
  }
  setTimeout(()=>($("#lemailWrap").hidden?$("#lpass"):LMODE==="setup"?$("#lname"):$("#lemail")).focus(),0);
}
$("#loginForm").onsubmit=async e=>{
  e.preventDefault(); $("#lerr").textContent="";
  const pw=$("#lpass").value;
  if(LMODE!=="login"&&pw!==$("#lpass2").value){ $("#lerr").textContent="The passwords don't match."; return; }
  try{
    if(LMODE==="login") await post("login",{email:$("#lemail").value,password:pw});
    else if(LMODE==="setup") await post("setup",{email:$("#lemail").value,name:$("#lname").value,password:pw,code:$("#lcode").value});
    else { await post("invite-accept",{token:INVITE,password:pw}); history.replaceState(null,"",location.pathname); }
    $("#lpass").value=$("#lpass2").value=""; $("#login").hidden=true; boot();
  }catch(err){ $("#lerr").textContent=err.message; }
};
$("#logoutBtn").onclick=async()=>{ await fetch("/api/ui/logout",{method:"POST",credentials:"same-origin"}); location.href=location.pathname; };


/* ---------- My account ---------- */
function linkText(l){return l==="own"?`<span class="link-own">your own admin login</span>`:l==="shared"?`<span class="link-shared">the shared admin login</span>`:`<span class="link-missing">not linked yet — ask an admin</span>`}
function renderAccount(){
  if(!ME) return;
  $("#acctBox").innerHTML=`
    <div class="acct" style="display:block">
      <div><b>${esc(ME.user)}</b> · ${esc(ME.email)} · <span class="rolebadge">${esc(ME.role)}</span></div>
      <div class="small" style="margin-top:6px">Your moves are sent to admin as ${linkText(ME.admin_link)}.</div>
    </div>
    <div class="acct">
      <label>Current password<input id="pwCur" type="password" autocomplete="current-password"></label>
      <label>New password (10+ characters)<input id="pwNew" type="password" autocomplete="new-password"></label>
      <button class="btn" type="button" id="pwBtn">Change password</button><span class="small" id="pwMsg"></span>
    </div>`;
  $("#pwBtn").onclick=async()=>{ try{ await post("password",{current:$("#pwCur").value,next:$("#pwNew").value}); $("#pwMsg").textContent="Password changed."; $("#pwCur").value=$("#pwNew").value=""; }catch(e){ $("#pwMsg").innerHTML=`<span style="color:var(--warn)">${esc(e.message)}</span>`; } };
}
function copyLine(text,label){
  const id="c"+Math.random().toString(36).slice(2);
  setTimeout(()=>{const b=document.getElementById(id); if(b) b.onclick=()=>{navigator.clipboard.writeText(text).then(()=>b.textContent="Copied")}},0);
  return `<div class="copyline"><span>${esc(label)}</span><code>${esc(text)}</code><button class="btn" type="button" id="${id}">Copy</button></div>`;
}


/* ---------- Users (admins) ---------- */
const ROLE_HELP={viewer:"search only",editor:"moves cards",approver:"full access",admin:"full access + manages users"};
async function renderUsers(){
  if(!ME||!ME.is_admin) return;
  const box=$("#usersBox");
  box.innerHTML=`${ME.full_access?`<div class="dim small" style="margin:4px 0 8px">Everyone signed in has full access: search and move cards. <b>Admin</b> only adds the Users tab.</div>`:""}<div class="adduser">
      <label>Name<input id="nuName" placeholder="Marisa Lopez"></label>
      <label>Work email<input id="nuEmail" type="email" placeholder="name@arenaclub.com"></label>
      <label>Role<select id="nuRole">${(ME.full_access?["approver","admin"]:["viewer","editor","approver","admin"]).map(r=>`<option value="${r}" ${r==="approver"?"selected":""}>${ME.full_access&&r==="approver"?"member":r} — ${ROLE_HELP[r]}</option>`).join("")}</select></label>
      <label>Admin user ID (optional)<input id="nuAdmin" placeholder="found from email if blank" size="30"></label>
      <button class="btn primary" type="button" id="nuBtn">Add person</button>
      <div id="nuOut" style="flex-basis:100%"></div>
    </div><div class="users tblwrap" id="usersTbl"><div class="dim small">Loading…</div></div>`;
  $("#nuBtn").onclick=async()=>{
    try{
      const r=await post("users-add",{name:$("#nuName").value,email:$("#nuEmail").value,role:$("#nuRole").value,admin_user_id:$("#nuAdmin").value});
      $("#nuOut").innerHTML=copyLine(r.invite_url,`Send this invite link to ${$("#nuName").value} (works once, 48 hours):`)+
        `<div class="small" style="margin-top:6px">${r.admin_user_id?(r.linked_automatically?"✓ Found their admin login from the email.":"✓ Linked to the admin user ID you entered."):`<span style="color:var(--warn)">No admin login found for that email. Until you paste their admin user ID, their moves go through the shared login.</span>`}</div>`;
      $("#nuName").value=$("#nuEmail").value=$("#nuAdmin").value=""; loadUsers();
    }catch(e){ $("#nuOut").innerHTML=`<span style="color:var(--warn)">${esc(e.message)}</span>`; }
  };
  loadUsers();
}
async function loadUsers(){
  let users; try{ users=await api("users"); }catch(e){ $("#usersTbl").textContent=e.message; return; }
  $("#usersTbl").innerHTML=`<table><tr><th>person</th><th>role</th><th>admin login</th><th>status</th><th>last sign-in</th><th></th></tr>${users.map(u=>`<tr data-id="${esc(u.id)}">
    <td><b>${esc(u.name)}</b><br><span class="dim">${esc(u.email)}</span></td>
    <td><select data-f="role" ${u.id===ME.id?"disabled":""}>${(ME.full_access?["approver","admin"]:["viewer","editor","approver","admin"]).map(r=>`<option value="${r}" ${r===u.role||(ME.full_access&&r==="approver"&&u.role!=="admin")?"selected":""}>${ME.full_access&&r==="approver"?"member":r}</option>`).join("")}</select></td>
    <td>${u.admin_user_id?`<span class="link-own">linked</span> <span class="dim small">${esc(u.admin_email||u.email)}</span>`:`<span class="link-shared">not linked</span>`}
      <br><button class="btn link" data-act="relink">link by admin email</button><button class="btn link" data-act="test">test</button><button class="btn link" data-act="setid">paste ID</button></td>
    <td>${!u.active?`<span class="dim">off</span>`:u.has_password?"active":`<span class="link-shared">invited</span>`}${u.has_mcp_key?` · <span class="dim">Claude</span>`:""}</td>
    <td class="dim">${u.last_login_at?when(u.last_login_at):"—"}</td>
    <td>${u.id===ME.id?`<span class="dim small">you</span>`:`${u.active&&!u.has_password?`<button class="btn link" data-act="invite">new invite link</button>`:""}${u.active&&u.has_password?`<button class="btn link" data-act="invite">reset password link</button>`:""}<button class="btn link" data-act="toggle">${u.active?"turn off":"turn on"}</button>`}</td>
  </tr><tr class="uout" data-for="${esc(u.id)}"><td colspan="6" style="padding:0;border:0"></td></tr>`).join("")}</table>`;
  const out=id=>document.querySelector(`tr.uout[data-for="${id}"] td`);
  $("#usersTbl").querySelectorAll("select[data-f=role]").forEach(sel=>sel.onchange=async()=>{const id=sel.closest("tr").dataset.id; try{await post("users-update",{id,role:sel.value}); out(id).innerHTML=`<span class="small">Role set to ${esc(sel.value)}.</span>`}catch(e){out(id).innerHTML=`<span style="color:var(--warn)">${esc(e.message)}</span>`}});
  $("#usersTbl").querySelectorAll("button[data-act]").forEach(b=>b.onclick=async()=>{
    const id=b.closest("tr").dataset.id, u=users.find(x=>x.id===id), o=out(id);
    try{
      if(b.dataset.act==="invite"){ const r=await post("users-invite",{id}); o.innerHTML=copyLine(r.invite_url,`Send to ${u.name} (works once, 48 hours; sets a new password):`); return; }
      if(b.dataset.act==="toggle"){ await post("users-update",{id,active:!u.active}); return loadUsers(); }
      if(b.dataset.act==="relink"){
        const email=prompt(`Email ${u.name} signs in to ADMIN with (can differ from their Move Bot email):`,u.admin_email||u.email); if(!email) return;
        o.innerHTML=`<span class="small"><span class="spin"></span>Looking up ${esc(email)} and testing admin access…</span>`;
        const r=await post("users-relink",{id,email:email.trim()});
        await loadUsers(); out(id).innerHTML=r.can_write?`<span class="small link-own">✓ Linked to ${esc(r.admin_email)} — admin accepts this login, so ${esc(u.name)} can move cards.</span>`:`<span class="small" style="color:var(--warn)">${esc(r.note||"Linked, but admin didn't accept the login.")}</span>`; return; }
      if(b.dataset.act==="test"){ o.innerHTML=`<span class="small"><span class="spin"></span>Testing…</span>`; const r=await post("users-test",{id});
        o.innerHTML=r.ok?`<span class="small link-own">✓ Admin accepts ${esc(u.name)}'s login — moves will work.</span>`:`<span class="small" style="color:var(--warn)">✗ Admin refused ${esc(u.name)}'s login (${r.status?`HTTP ${r.status}`:"not linked"}${r.error?": "+esc(r.error.slice(0,120)):""}). Use “link by admin email” with the email they use in admin, or give them admin permissions there.</span>`; return; }
      if(b.dataset.act==="setid"){ const v=prompt(`Admin user ID for ${u.name} (blank to unlink):`,u.admin_user_id||""); if(v===null) return; await post("users-update",{id,admin_user_id:v.trim()}); return loadUsers(); }
    }catch(e){ o.innerHTML=`<span style="color:var(--warn)">${esc(e.message)}</span>`; }
  });
}

      <b>Setup check</b>
      <div class="small dim" style="margin:4px 0 10px">Checks Vercel env vars, Neon, Metabase, your admin login and the move call. Read-only — nothing is moved.
        Paste an ITEM_ID (⧉ next to “ID” on any tile copies it) to confirm the bot sees it in the repack warehouse.</div>
      <label class="small">ITEM_ID (optional)<input id="suId" placeholder="0152b342-e69e-41ef-9a8c-65c6cc914c1f" size="40" style="display:block;margin:4px 0 8px"></label>
      <button class="btn primary" type="button" id="suBtn">Run setup check</button>
      <div id="suOut" style="margin-top:12px"></div>
    </div>`;
  $("#suBtn").onclick=async()=>{
    const o=$("#suOut"); o.innerHTML=`<span class="spin"></span>Checking…`;

        <div class="small" style="margin-top:8px">${r.ready?`<span class="link-own">✓ Everything checks out.</span>`:`<span style="color:var(--warn)">Fix the ❌ rows in Vercel → Settings → Environment Variables, then redeploy.</span>`}</div>`;

/* ---------- start-up ---------- */
async function boot(){
  let me;
  try{ me=await api("me"); }catch{ return; }
  if(INVITE){ history.replaceState(null,"",location.pathname); }
  ME=me;
  $("#whoami").innerHTML=`Signed in as <b>${esc(me.user)}</b> <span class="rolebadge">${esc(me.role)}</span>`;
  $("#tabBtn-users").hidden=!me.is_admin; $("#tabBtn-setup").hidden=!me.is_admin;
  const b=$("#modeBadge");
  if(me.dry_run){ b.textContent="DRY RUN — nothing is written"; b.className="mode"; $("#dry").checked=true; $("#dry").disabled=true; $("#foot").textContent="DRY_RUN is on in Vercel, so every move is logged but nothing is sent to admin."; }
  else{ b.textContent="LIVE — moves cards in admin"; b.className="mode live"; }
  loadSaved(); renderHistory(); showTab("request");
  if(!S){ $("#empty").innerHTML=EMPTY_HELP; }
  renderBands();
}
if(INVITE) showLogin(); else boot();
